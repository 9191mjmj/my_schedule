name: 🚀 自动编译手机端 APK (Build Android APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 📱 编译地大课表 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出最新源码
        uses: actions/checkout@v4

      - name: ☕ 配置 Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 安装项目依赖
        run: npm install

      - name: 🔄 同步 Web 资源至 Android 原生工程
        run: npx cap sync android

      - name: 🔨 接受 SDK 许可并编译 APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 上传打包好的 APK 安装包供直接下载
        uses: actions/upload-artifact@v4
        with:
          name: 地大课表-Android安装包
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ 自动发布 GitHub Release (提供手机直链下载)
        uses: softprops/action-gh-release@v2
        with:
          name: "📱 地大课表 Android 最新版"
          tag_name: "latest"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
