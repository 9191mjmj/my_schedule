<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的课表</title>
<style>
  * { box-sizing: border-box; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; 
    background: #f8f9fa; margin: 0; padding: 20px; color: #1e293b; 
  }
  h1 { text-align: center; color: #0f172a; margin-bottom: 15px; font-size: 28px; }

  #info-bar {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 1200px; margin: 0 auto 20px; padding: 15px 25px;
    background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }
  #info-bar .week-info { font-size: 20px; font-weight: bold; color: #3b82f6; }
  #info-bar .date-info { color: #64748b; font-size: 15px; }
  #next-class-card {
    background: #eff6ff; color: #1e40af; padding: 10px 15px; border-radius: 8px;
    border-left: 4px solid #3b82f6; font-size: 14px; min-width: 250px;
  }
  #next-class-card span { font-weight: bold; color: #2563eb; }

  #controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
  button { padding: 10px 24px; font-size: 15px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3); }
  button:hover { background: #2563eb; transform: translateY(-2px); }
  button.gray { background: #64748b; box-shadow: 0 2px 6px rgba(100, 116, 139, 0.3); }
  button.gray:hover { background: #475569; }
  .week-selector-wrapper { display: flex; align-items: center; gap: 10px; background: white; padding: 6px 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
  #weekSelector { padding: 8px 12px; font-size: 15px; border-radius: 6px; border: none; outline: none; cursor: pointer; background: transparent; color: #3b82f6; font-weight: bold; }

  /* 设置面板 */
  #settingsPanel {
    display: none; max-width: 600px; margin: 0 auto 20px; background: white; padding: 25px;
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #e2e8f0;
  }
  #settingsPanel h3 { margin: 0 0 15px 0; color: #0f172a; font-size: 18px; }
  #settingsPanel p { color: #64748b; font-size: 13px; margin: 0 0 15px 0; }
  .setting-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .setting-row label { width: 90px; font-size: 14px; color: #475569; font-weight: 600; }
  .setting-row input { flex: 1; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; outline: none; }
  .setting-row input:focus { border-color: #3b82f6; }
  .setting-row .sep { color: #94a3b8; }
  .setting-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .setting-actions button { padding: 8px 18px; font-size: 14px; }

  #schedule {
    background: transparent;
  background-size: cover;            /* 图片铺满 */
  background-position: center;       /* 图片居中 */
  background-repeat: no-repeat;
  position: relative;                /* 供遮罩层定位 */
    max-width: 1200px; margin: 0 auto; display: grid;
    grid-template-columns: 100px repeat(7, 1fr);
    grid-template-rows: 60px repeat(6, 110px); 
    border-radius: 12px; overflow: hidden; 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06); border: 1px solid #e2e8f0;
  }
  .header { background: white; color: #475569; font-weight: bold; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 1px solid #e2e8f0; }
  .header .date { font-size: 12px; font-weight: normal; color: #94a3b8; margin-top: 2px; }
  .period { background: white; color: #64748b; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #f1f5f9; padding: 5px; text-align: center;}
  .period .time { font-size: 10px; color: #94a3b8; font-weight: normal; margin-top: 3px; }
  .course {
    margin: 5px; padding: 8px; border-radius: 8px; color: white;
    font-size: 12px; overflow: hidden; z-index: 10; display: flex; flex-direction: column; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1); transition: all 0.2s ease; cursor: default; border: 1px solid rgba(255,255,255,0.2);
  }
  .course:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 15px rgba(0,0,0,0.15); z-index: 20; }
  .course-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; line-height: 1.3; }
  .course-info { font-size: 11px; opacity: 0.95; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .today-column { background: #e0f2fe; }
  .empty-tip { grid-column: 2 / span 7; grid-row: 2 / span 6; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 18px; font-weight: 500; background: #f8fafc; border-radius: 8px; margin: 10px; }
</style>
</head>
<body>

<h1>📅 我的课表</h1>

<div id="info-bar">
  <div>
    <div class="week-info" id="displayWeek">第 X 周</div>
    <div class="date-info" id="displayDate">--</div>
  </div>
  <div id="next-class-card">
    下一节课：<span id="nextClassInfo">正在计算...</span>
  </div>
</div>

<div id="controls">
  <button onclick="loadSchedule()">刷新课表数据</button>
  <button class="gray" onclick="toggleSettings()">⚙️ 设置上课时间</button>
  <button class="gray" onclick="document.getElementById('bgInput').click()">🖼️ 设置背景图</button>
<input type="file" id="bgInput" accept="image/*" style="display:none" onchange="setBackground(this)">
<button class="gray" onclick="clearBackground()">❌ 清除背景</button>
  <div class="week-selector-wrapper">
    <label for="weekSelector">查看周次：</label>
    <select id="weekSelector"></select>
  </div>
</div>

<!-- 设置面板 -->
<div id="settingsPanel">
  <h3>⚙️ 自定义上课时间</h3>
  <p>修改后点击保存，会存在你的浏览器里，下次打开自动生效。</p>
  <div id="settingsRows"></div>
  <div class="setting-actions">
    <button class="gray" onclick="resetSettings()">恢复默认</button>
    <button onclick="saveSettings()">保存</button>
    <button class="gray" onclick="toggleSettings()">关闭</button>
  </div>
</div>

<div id="schedule"></div>

<script>
// ==========================================
// ⚠️ 设置开学第一天（必须修改成你学校的真实开学日期）
// ==========================================
const SEMESTER_START_DATE = '2026-09-01';

// 默认作息（用户可以在页面上自己改）
const DEFAULT_TIMES = [
  { period: 1, start: '08:00', end: '09:40' },
  { period: 2, start: '10:00', end: '11:40' },
  { period: 3, start: '14:00', end: '15:40' },
  { period: 4, start: '16:00', end: '17:40' },
  { period: 5, start: '19:00', end: '20:40' },
  { period: 6, start: '20:50', end: '22:30' }
];

// 从 localStorage 读取用户保存的时间，没有就用默认值
let PERIOD_TIMES = loadSettings();

function loadSettings() {
  const saved = localStorage.getItem('my_schedule_times');
  if (saved) {
    try { return JSON.parse(saved); } catch (e) { return [...DEFAULT_TIMES]; }
  }
  return [...DEFAULT_TIMES];
}

function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  if (panel.style.display === 'none' || panel.style.display === '') {
    renderSettingsRows();
    panel.style.display = 'block';
  } else {
    panel.style.display = 'none';
  }
}

function renderSettingsRows() {
  const container = document.getElementById('settingsRows');
  container.innerHTML = '';
  PERIOD_TIMES.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'setting-row';
    row.innerHTML = `
      <label>第 ${t.period} 大节</label>
      <input type="time" value="${t.start}" data-index="${i}" data-field="start">
      <span class="sep">—</span>
      <input type="time" value="${t.end}" data-index="${i}" data-field="end">
    `;
    container.appendChild(row);
  });
}

function saveSettings() {
  const inputs = document.querySelectorAll('#settingsRows input');
  inputs.forEach(input => {
    const idx = parseInt(input.dataset.index);
    const field = input.dataset.field;
    PERIOD_TIMES[idx][field] = input.value;
  });
  localStorage.setItem('my_schedule_times', JSON.stringify(PERIOD_TIMES));
  alert('已保存！');
  toggleSettings();
  filterAndRender();
}

function resetSettings() {
  if (!confirm('确定恢复默认时间？')) return;
  PERIOD_TIMES = [...DEFAULT_TIMES];
  localStorage.removeItem('my_schedule_times');
  renderSettingsRows();
}

// ============ 时间日期计算 ============
let allCourses = [];
const COLORS = ['#e57373', '#81c784', '#64b5f6', '#ffb74d', '#ba68c8', '#4db6ac', '#f06292', '#aed581', '#7986cb', '#a1887f'];

function getColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return COLORS[Math.abs(hash) % COLORS.length];
}

function getCurrentWeek() {
  const start = new Date(SEMESTER_START_DATE);
  const today = new Date();
  const diffDays = Math.floor((today - start) / (1000 * 60 * 60 * 24));
  let week = Math.ceil((diffDays + 1) / 7);
  if (week < 1) week = 1;
  if (week > 20) week = 20;
  return week;
}

function getDatesForWeek(weekNum) {
  const start = new Date(SEMESTER_START_DATE);
  const monday = new Date(start.getTime() + (weekNum - 1) * 7 * 24 * 60 * 60 * 1000);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday.getTime() + i * 24 * 60 * 60 * 1000);
    dates.push(`${d.getMonth() + 1}/${d.getDate()}`);
  }
  return dates;
}

function isWeekInZcd(targetWeek, zcdStr) {
  if (!zcdStr) return true;
  const cleanStr = zcdStr.replace(/，/g, ',').replace(/周/g, '');
  const parts = cleanStr.split(',');
  for (let part of parts) {
    let isSingle = part.includes('单');
    let isDouble = part.includes('双');
    part = part.replace(/\(单\)/, '').replace(/\(双\)/, '').trim();
    let start, end;
    if (part.includes('-')) {
      const range = part.split('-');
      start = parseInt(range[0]);
      end = parseInt(range[1]);
    } else { start = end = parseInt(part); }
    if (targetWeek >= start && targetWeek <= end) {
      if (isSingle && targetWeek % 2 === 0) continue;
      if (isDouble && targetWeek % 2 !== 0) continue;
      return true;
    }
  }
  return false;
}

function updateNextClassCard(week, courses) {
  const card = document.getElementById('nextClassInfo');
  const today = new Date();
  const currentDay = today.getDay() === 0 ? 7 : today.getDay();
  const nowMin = today.getHours() * 60 + today.getMinutes();

  if (week !== getCurrentWeek()) {
    card.textContent = '查看的是非本周课表';
    return;
  }

  let nextCourse = null;
  let minDiff = Infinity;

  courses.filter(c => parseInt(c.xqj) === currentDay).forEach(c => {
    const startPeriod = parseInt(c.jcs.split('-')[0]);
    const bigPeriod = Math.ceil(startPeriod / 2);
    const timeObj = PERIOD_TIMES.find(p => p.period === bigPeriod);
    if (!timeObj) return;
    const [h, m] = timeObj.start.split(':').map(Number);
    const startMin = h * 60 + m;
    if (startMin > nowMin) {
      const diff = startMin - nowMin;
      if (diff < minDiff) { minDiff = diff; nextCourse = c; }
    }
  });

  if (nextCourse) {
    const bigPeriod = Math.ceil(parseInt(nextCourse.jcs.split('-')[0]) / 2);
    const timeObj = PERIOD_TIMES.find(p => p.period === bigPeriod);
    card.innerHTML = `<b>${nextCourse.kcmc}</b> (${timeObj.start})<br>地点：${nextCourse.cdmc}`;
  } else {
    card.textContent = '今天没有后续课程了，休息一下吧！';
  }
}

function filterAndRender() {
  const selectedWeek = parseInt(document.getElementById('weekSelector').value);
  const filtered = allCourses.filter(c => isWeekInZcd(selectedWeek, c.zcd));
  document.getElementById('displayWeek').textContent = `第 ${selectedWeek} 周`;
  const dates = getDatesForWeek(selectedWeek);
  document.getElementById('displayDate').textContent = `${dates[0].replace('/', '月')}日 - ${dates[6].replace('/', '月')}日`;
  updateNextClassCard(selectedWeek, allCourses);
  renderSchedule(filtered, selectedWeek, dates, getCurrentWeek());
}

async function loadSchedule() {
  const grid = document.getElementById('schedule');
  grid.innerHTML = '<div style="text-align:center; grid-column: 1/-1; padding: 50px; color:#666;">正在从教务系统获取最新数据...</div>';
  try {
    const res = await fetch('http://127.0.0.1:3000/api/schedule');
    const data = await res.json();
    if (data.success) {
      allCourses = data.courses;
      const weekSelector = document.getElementById('weekSelector');
      if (weekSelector.options.length === 0) {
        for (let i = 1; i <= 20; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = `第 ${i} 周`;
          weekSelector.appendChild(opt);
        }
        weekSelector.addEventListener('change', filterAndRender);
        weekSelector.value = getCurrentWeek();
      }
      filterAndRender();
    } else {
      grid.innerHTML = `<div class="empty-tip" style="color: red;">获取失败：${data.message}</div>`;
    }
  } catch (e) {
    grid.innerHTML = `<div class="empty-tip" style="color: red;">网络连接失败，请确认后端服务器已启动。</div>`;
    console.error(e);
  }
}

function renderSchedule(courses, currentWeek, dates, currentRealWeek) {
  const grid = document.getElementById('schedule');
  grid.innerHTML = '';
  const days = ['节次', '周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  const todayIndex = new Date().getDay() === 0 ? 7 : new Date().getDay();

  days.forEach((d, index) => {
    const el = document.createElement('div');
    el.className = 'header';
    if (index === 0) el.textContent = d;
    else if (currentWeek === currentRealWeek && index === todayIndex) {
      el.innerHTML = `<span style="color:#3b82f6;">${d}</span><span class="date" style="color:#3b82f6;font-weight:bold;">${dates[index-1]}</span>`;
      el.classList.add('today-column');
    } else {
      el.innerHTML = `<span>${d}</span><span class="date">${dates[index-1]}</span>`;
    }
    el.style.gridRow = 1;
    el.style.gridColumn = index + 1;
    grid.appendChild(el);
  });

  for (let p = 1; p <= 6; p++) {
    const label = document.createElement('div');
    label.className = 'period';
    const t = PERIOD_TIMES.find(item => item.period === p);
    label.innerHTML = `<span>第 ${p} 大节</span><span class="time">${t.start}-${t.end}</span>`;
    label.style.gridRow = p + 1;
    label.style.gridColumn = 1;
    grid.appendChild(label);
  }

  if (courses.length === 0) {
    const tip = document.createElement('div');
    tip.className = 'empty-tip';
    tip.textContent = `第 ${currentWeek} 周没有课程，好好休息！`;
    grid.appendChild(tip);
    return;
  }

  courses.forEach(c => {
    let start = 1, end = 1;
    if (c.jcs) {
      const parts = c.jcs.split('-');
      start = parseInt(parts[0]);
      end = parts.length > 1 ? parseInt(parts[1]) : start;
    }
    let bigStart = Math.ceil(start / 2);
    let bigEnd = Math.ceil(end / 2);
    if (bigEnd > 6) bigEnd = 6;
    if (bigStart > 6) bigStart = 6;
    const day = parseInt(c.xqj) || 1;
    const el = document.createElement('div');
    el.className = 'course';
    if (currentWeek === currentRealWeek && day === todayIndex) el.classList.add('today-column');
    el.style.gridColumn = day + 1;
    el.style.gridRow = `${bigStart + 1} / span ${bigEnd - bigStart + 1}`;
    el.style.background = getColor(c.kcmc);
    el.innerHTML = `
      <div class="course-name">${c.kcmc}</div>
      <div class="course-info">${c.cdmc}</div>
      <div class="course-info">${c.xm}</div>
      <div class="course-info">${c.zcd}</div>
    `;
    grid.appendChild(el);
  });
}

window.onload =function(){
    loadBackground();
    loadSchedule();
}
// ============ 背景图功能 ============
function setBackground(input) {
    const file = input.files[0];
    if (!file) return;

    // 限制图片大小（localStorage 上限约 5MB，太大存不下）
    if (file.size > 2 * 1024 * 1024) {
        alert('图片太大（超过 2MB），请换一张小一点的。');
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        const dataUrl = e.target.result;
        const schedule = document.getElementById('schedule');
        schedule.style.backgroundImage = `url(${dataUrl})`;
        schedule.style.backgroundSize = 'cover';
        schedule.style.backgroundPosition = 'center';
        try {
            localStorage.setItem('my_schedule_bg', dataUrl);
        } catch (err) {
            alert('图片太大，存不进浏览器，但本次会话仍然生效。');
        }
    };
    reader.readAsDataURL(file);
}

function clearBackground() {
    if (!confirm('确定清除背景图？')) return;
    const schedule = document.getElementById('schedule');
    schedule.style.backgroundImage = '';
    localStorage.removeItem('my_schedule_bg');
}

// 页面加载时，自动恢复用户之前设置的背景图
function loadBackground() {
    const saved = localStorage.getItem('my_schedule_bg');
    if (saved) {
        const schedule = document.getElementById('schedule');
        schedule.style.backgroundImage = `url(${saved})`;
        schedule.style.backgroundSize = 'cover';
        schedule.style.backgroundPosition = 'center';
    }
}
</script>
</body>
</html>
